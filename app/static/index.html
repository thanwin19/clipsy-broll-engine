<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipsy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D12;--side:#10131A;--panel:#171B25;--panel2:#1D2230;--line:#292F3D;--line2:#323949;
  --text:#F4F5F8;--muted:#9AA3B5;--dim:#6B7386;--vio:#8B5CF6;--vio2:#7C4DEB;--cyan:#22D3EE;--ok:#34D399;--warn:#F5B544;--bad:#F2667A;
  --r:10px;--r2:14px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
svg:not([width]){width:16px;height:16px;flex-shrink:0}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan);text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
:focus-visible{outline:2px solid var(--vio);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#262c3a;border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:76px 1fr;height:100%}
.rail{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(135deg,var(--vio),#5B3DF0);box-shadow:0 6px 18px rgba(139,92,246,.35)}
.nav{width:56px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);cursor:pointer;border:0;background:none;font-size:10px;font-weight:600;letter-spacing:.01em}
.nav svg{width:20px;height:20px}
.nav:hover{color:var(--text);background:#161a24}
.nav.on{color:var(--text);background:#1b2030}
.nav.on svg{color:var(--vio)}
.rail .spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2a3146,#1a1f2c);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;height:100%;min-height:0}
.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(11,13,18,.85);backdrop-filter:blur(8px);flex-shrink:0}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;width:280px;color:var(--dim);cursor:pointer}
.search kbd,kbd{font:600 11px Inter;color:var(--muted);background:#232838;border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.saved{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.run{background:var(--cyan);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.ibtn:hover{color:var(--text);border-color:var(--line2)}
.ibtn svg{width:17px;height:17px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--vio);color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px;line-height:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#1c2130}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--vio);border-color:var(--vio);color:#fff}
.btn.pri:hover{background:var(--vio2)}
.btn.cy{border-color:rgba(34,211,238,.35);color:var(--cyan);background:rgba(34,211,238,.07)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.view{flex:1;overflow:auto;min-height:0}
.wrap{max-width:1440px;margin:0 auto;padding:28px 32px 48px}
h1{font-size:30px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
h3{font-size:13px;margin:0;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2)}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chip svg{width:12px;height:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:#1f2433;color:var(--muted);border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.07)}
.chip.run{color:var(--cyan);border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.07)}
.chip.bad{color:var(--bad);border-color:rgba(242,102,122,.3);background:rgba(242,102,122,.07)}
.chip.vio{color:#C4B5FD;border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.1)}
.chip.ai{color:var(--cyan);border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.06)}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{width:42px;height:42px;color:#3a4256;margin-bottom:10px}
.sk{background:linear-gradient(90deg,#171b25,#1f2431,#171b25);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;margin-top:22px}
.drop{border:1.5px dashed #343b4d;border-radius:var(--r2);padding:22px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,rgba(139,92,246,.05),transparent 60%);transition:.2s}
.drop.over{border-color:var(--vio);background:rgba(139,92,246,.08)}
.wave{display:flex;align-items:center;gap:3px;height:38px}
.wave i{width:3px;border-radius:2px;background:linear-gradient(var(--cyan),var(--vio));opacity:.75;animation:wv 1.6s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.45)}}
.choices{display:grid;grid-template-columns:1fr;gap:12px}
.choice{padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.15s;text-align:left}
.choice:hover{border-color:var(--vio);transform:translateY(-1px)}
.choice .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(139,92,246,.12);color:#C4B5FD;margin-bottom:10px}
.choice .ic svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.proj{border-radius:var(--r2);overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.15s;position:relative}
.proj:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb{aspect-ratio:16/9;background:#0e1118 center/cover no-repeat;position:relative}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);border-radius:6px;padding:1px 7px;font:600 11px Inter}
.thumb .st{position:absolute;left:8px;top:8px}
.proj .meta{padding:12px 14px}
.proj .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{display:flex;gap:6px;margin-top:10px;opacity:0;transition:.15s}
.proj:hover .qa{opacity:1}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow .s{padding:8px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:12.5px}
.flow .a{color:var(--dim)}
.act{display:flex;flex-direction:column;gap:2px}
.act .i{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid #1f2430;font-size:13px}
.act .i:last-child{border:0}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:440px 1fr;height:100%;min-height:0}
.studio.has-dir{grid-template-columns:400px 1fr 330px}
#script{min-height:300px;font-size:15px}
.col{overflow:auto;min-height:0;padding:20px}
.col.l{border-right:1px solid var(--line);background:#0d1016}
.col.r{border-left:1px solid var(--line);background:#0d1016}
label.lb{display:block;font-size:11.5px;color:var(--muted);margin:16px 0 7px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
textarea,input[type=text],input[type=url],select{width:100%;background:#0f1219;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
textarea{min-height:210px;resize:vertical;line-height:1.55}
textarea:focus,input:focus,select:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.seg{display:flex;background:#0f1219;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:7px;color:var(--muted);font-weight:600;cursor:pointer;font-size:12.5px}
.seg button.on{background:#232a3b;color:var(--text)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:#121621;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted)}
.pill.on{border-color:var(--vio);color:var(--text);background:rgba(139,92,246,.12)}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.stages{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.stage{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--dim)}
.stage .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid #3a4256;display:grid;place-items:center;flex-shrink:0}
.stage.done{color:var(--muted)} .stage.done .ck{background:var(--ok);border-color:var(--ok);color:#06281c}
.stage.now{color:var(--text);background:rgba(34,211,238,.06)} .stage.now .ck{border-color:var(--cyan);border-top-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;background:#1c2130;border-radius:9px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--vio),var(--cyan));transition:width .5s;border-radius:9px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sc{border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow:hidden;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.sc .thumb{aspect-ratio:16/9}
.sc .b{padding:10px 12px;font-size:12.5px}
.sc .nar{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}
.sect{padding:14px 0;border-bottom:1px solid #1d2230}
.sect:last-child{border:0}
.meter{height:5px;background:#1c2130;border-radius:9px;overflow:hidden;margin-top:4px}
.meter>div{height:100%;background:var(--cyan);border-radius:9px}
.warnbox{border:1px solid rgba(245,181,68,.3);background:rgba(245,181,68,.06);border-radius:9px;padding:8px 10px;font-size:12px;color:#f3d8a4;margin-top:6px}

/* ---------- editor ---------- */
.editor{display:grid;grid-template-columns:300px 1fr 320px;grid-template-rows:auto 1fr 268px;height:100%;min-height:0}
.etool{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0d1016}
.etool .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tbtn{height:32px;min-width:32px;padding:0 8px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:600}
.tbtn:hover:not(:disabled){background:#1a1f2b;color:var(--text)}
.tbtn.on{background:#1f2536;color:var(--text);border-color:var(--line2)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.tbtn svg{width:16px;height:16px}
.epanel{overflow:auto;min-height:0;background:#0d1016}
.epanel.l{border-right:1px solid var(--line)} .epanel.r{border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d1016;z-index:2}
.tabs button{flex:1;border:0;background:none;color:var(--dim);font-weight:600;font-size:12px;padding:7px 4px;border-radius:7px;cursor:pointer}
.tabs button.on{background:#1b2030;color:var(--text)}
.asset{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.asset:hover{background:#141824}
.asset.on{border-color:var(--vio);background:rgba(139,92,246,.07)}
.asset .tn{width:86px;aspect-ratio:16/9;border-radius:7px;background:#0e1118 center/cover;flex-shrink:0;position:relative}
.asset .tn span{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.7);border-radius:4px;font:600 10px Inter;padding:0 4px}
.asset .tx{min-width:0;font-size:12px}
.asset .tx b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagewrap{display:flex;flex-direction:column;min-height:0;min-width:0;background:#090b10}
.screen{flex:1;display:grid;place-items:center;min-height:0;padding:16px;position:relative}
.frame{position:relative;max-width:100%;max-height:100%;aspect-ratio:16/9;height:100%;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px #20263a,0 20px 50px rgba(0,0,0,.6)}
.frame video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.safe{position:absolute;inset:5%;border:1px dashed rgba(255,255,255,.35);pointer-events:none;display:none}
.safe.on{display:block}
.safe:after{content:"";position:absolute;inset:5%;border:1px dashed rgba(34,211,238,.35)}
.pctl{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);background:#0d1016}
.tc{font:600 12.5px "JetBrains Mono",monospace;color:var(--text)}
.timeline{grid-column:1/-1;border-top:1px solid var(--line);background:#0b0d13;display:flex;flex-direction:column;min-height:0}
.tlhead{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #1b202c}
.tlbody{flex:1;display:grid;grid-template-columns:150px 1fr;min-height:0;overflow:hidden}
.trk-h{border-right:1px solid #1b202c;background:#0d1016}
.trk-h .h{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid #161b26}
.trk-h .h.ruler{height:26px}
.trk-h .h.v{height:56px}
.trk-h .h svg{width:14px;height:14px}
.lanes{overflow-x:auto;overflow-y:hidden;position:relative}
.lanes-in{position:relative;min-width:100%}
.ruler{height:26px;border-bottom:1px solid #161b26;position:relative;cursor:pointer}
.ruler i{position:absolute;top:0;bottom:0;border-left:1px solid #252b3a}
.ruler i span{position:absolute;left:4px;top:5px;font:500 10px "JetBrains Mono",monospace;color:var(--dim)}
.lane{height:40px;border-bottom:1px solid #161b26;position:relative}
.lane.v{height:56px}
.clip{position:absolute;top:4px;bottom:4px;border-radius:7px;overflow:hidden;cursor:pointer;border:1px solid #2b3245;background:#1a1f2b}
.clip.v{background-size:auto 100%;background-repeat:repeat-x}
.clip.v .lbl{position:absolute;left:0;right:0;bottom:0;padding:2px 6px;font-size:10.5px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.on{border-color:var(--vio);box-shadow:0 0 0 1px var(--vio)}
.clip.flag:after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.clip.cap{background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.3);font-size:10.5px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9ccff}
.clip.mus{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.25);font-size:11px;padding:4px 8px;color:#a7f3d0}
.clip.vo{background:rgba(34,211,238,.06) center/100% 100% no-repeat;border-color:rgba(34,211,238,.22)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);pointer-events:none;z-index:5}
.playhead:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--bad)}
.stagewrap.theater{position:fixed;inset:0;z-index:200;background:#000}
.stagewrap.theater .sugg{display:none}
.stagewrap.theater .screen{padding:0}.stagewrap.theater .frame{border-radius:0;box-shadow:none}
.sugg.min .sg,.sugg.min .sghead button{display:none}.sugg.min{width:auto;cursor:pointer}
.sugg{position:absolute;right:14px;bottom:14px;width:320px;max-height:60%;overflow:auto;z-index:6}
.sg{padding:10px 12px;border-bottom:1px solid #1f2430;font-size:12.5px}
.sg:last-child{border:0}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alt{border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:#10131a}
.alt:hover{border-color:var(--vio)}
.alt .thumb{aspect-ratio:16/9}
.alt div.c{padding:4px 6px;font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between}

/* ---------- export ---------- */
.export{display:grid;grid-template-columns:290px 1fr 330px;height:100%;min-height:0}
.preset{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;margin-bottom:8px}
.preset.on{border-color:var(--vio);background:rgba(139,92,246,.08)}
.preset .pi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#232838;flex-shrink:0;font-size:11px;font-weight:700}
.checklist div{display:flex;gap:9px;align-items:center;padding:6px 0;font-size:13px}
.ok-i{color:var(--ok)} .bad-i{color:var(--bad)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2232;border:1px solid var(--line2);padding:10px 16px;border-radius:11px;box-shadow:var(--shadow);font-weight:500;z-index:100;display:flex;gap:10px;align-items:center;animation:rise .25s ease}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.6);backdrop-filter:blur(3px);display:grid;place-items:start center;padding-top:12vh;z-index:90}
.palette{width:min(600px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.palette input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 18px;font-size:15px;background:none}
.palette .it{padding:10px 18px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.palette .it.on,.palette .it:hover{background:#1f2536}
.notif{position:absolute;right:20px;top:52px;width:340px;z-index:80}
.tip[data-tip]{position:relative}
.tip[data-tip]:hover:after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#232838;border:1px solid var(--line2);color:var(--text);font-size:11.5px;font-weight:500;padding:5px 8px;border-radius:7px;white-space:nowrap;z-index:50;pointer-events:none}

@media (max-width:1180px){
  .studio.done{display:flex;flex-direction:column}.studio.done .col.l{order:2;border-right:0;border-top:1px solid var(--line)}
  .studio.done{height:auto}
  .studio{grid-template-columns:320px 1fr}.studio .col.r{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .editor{grid-template-columns:1fr 300px;grid-template-rows:auto 1fr 240px}.editor .epanel.l{display:none}
  .export{grid-template-columns:1fr 300px}.export .exl{display:none}
  .hero{grid-template-columns:1fr}
}

  if(m){const s=(+m[1])*3600+(+m[2])*60+(+m[3])+(+m[4])/1000,e=(+m[5])*3600+(+m[6])*60+(+m[7])+(+m[8])/1000;out.push({s,e,t:m[9].trim()})}});return out}

  v.innerHTML=`<div class="wrap" style="max-width:900px"><h1 style="font-size:24px">Settings</h1>
   <div class="card pad" style="margin-top:20px"><h2>Access</h2><label class="lb">API access token</label><div class="row"><input type="text" id="tok" value="${esc(TOKEN)}" placeholder="Only needed when the server sets API_TOKEN"><button class="btn" id="savetok">Save</button></div><div class="hint">Stored in this browser only.</div></div>
   <div class="card pad" style="margin-top:14px"><h2>Service status</h2><dl class="kv" style="margin-top:10px">${Object.entries(ready.checks||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd><span class="chip ${v?'ok':'bad'}">${v?'OK':'Down'}</span></dd>`).join('')}<dt>Voices available</dt><dd>${vc.voices.length} + ${(vc.styles||[]).length} styles</dd></dl>
    <div class="row" style="margin-top:12px"><a class="btn sm" href="/docs" target="_blank">API docs ↗</a><a class="btn sm" href="/api/v1/errors" target="_blank">Error codes ↗</a></div></div>
   <div class="card pad" style="margin-top:14px"><h2>Keyboard shortcuts</h2><dl class="kv" style="margin-top:10px"><dt>Command palette</dt><dd><kbd>Ctrl K</kbd></dd><dt>Play / pause (editor)</dt><dd><kbd>Space</kbd></dd><dt>Previous / next scene</dt><dd><kbd>J</kbd> <kbd>L</kbd></dd><dt>Step one frame</dt><dd><kbd>←</kbd> <kbd>→</kbd></dd><dt>Close dialogs</dt><dd><kbd>Esc</kbd></dd></dl></div>
   <div class="card pad" style="margin-top:14px"><h2>Defaults & connected services</h2><p class="muted">Footage: Pixabay, Coverr, Pexels, NASA, Wikimedia, Internet Archive, Openverse · Voice: Gemini, Kokoro, eSpeak NG · Planning & judge: Gemini. Keys are configured on the server (.env), never in the browser.</p></div></div>`;
  $('#savetok').onclick=()=>{TOKEN=$('#tok').value.trim();try{localStorage.setItem('clipsy_token',TOKEN)}catch{}toast('Token saved','ok');ping()}}

/* ===================== dialogs ===================== */
function ask(title,body,yes){$('#layer').innerHTML=`<div class="modal" id="dlg"><div class="palette pad" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="padding:20px">
  <h2>${esc(title)}</h2><p class="muted" style="margin:8px 0 18px">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="dno">Cancel</button><button class="btn pri" id="dyes">Confirm</button></div></div></div>`;
  $('#dno').onclick=()=>$('#layer').innerHTML='';$('#dyes').onclick=()=>{$('#layer').innerHTML='';yes()};$('#dlg').onclick=e=>{if(e.target.id==='dlg')$('#layer').innerHTML=''};$('#dyes').focus()}

/* ===================== palette & notifications ===================== */
async function palette(){const ps=S.projects.length?S.projects:await loadProjects();
  const cmds=[...NAV.map(([k,l,h])=>({t:'Go to '+l,h,k:'nav'})),{t:'Create new video',h:'#/studio',k:'action'},...ps.slice(0,30).map(p=>({t:p.title,h:(p.status==='succeeded'?'#/editor/':'#/studio/')+p.job_id,k:STATUS(p)[0]}))];
  $('#layer').innerHTML=`<div class="modal" id="pm"><div class="palette" role="dialog" aria-label="Command palette"><input id="pin" placeholder="Search projects and commands…" autofocus><div id="pres" style="max-height:50vh;overflow:auto"></div></div></div>`;
  let sel=0,rows=cmds;const draw=()=>{$('#pres').innerHTML=rows.slice(0,40).map((c,i)=>`<div class="it ${i===sel?'on':''}" data-i="${i}"><span>${esc(c.t)}</span><span class="dim" style="font-size:12px">${esc(c.k)}</span></div>`).join('')||'<div class="it">No results</div>';
    $$('#pres .it').forEach(el=>el.onclick=()=>{$('#layer').innerHTML='';go(rows[+el.dataset.i].h)})};
  $('#pin').oninput=e=>{const q=e.target.value.toLowerCase();rows=cmds.filter(c=>c.t.toLowerCase().includes(q));sel=0;draw()};
  $('#pin').onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(rows.length-1,sel+1);draw()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw()}if(e.key==='Enter'&&rows[sel]){$('#layer').innerHTML='';go(rows[sel].h)}};
  $('#pm').onclick=e=>{if(e.target.id==='pm')$('#layer').innerHTML=''};draw();$('#pin').focus()}

async function ping(){try{const r=await (await fetch('/ready')).json();const ok=r.status==='ready';$('#srvdot').className='dot'+(ok?'':' run');$('#srvdot').style.background=ok?'':'var(--bad)';$('#srvtxt').textContent=ok?'Engine online · autosaved':'Engine not ready'}
  catch{$('#srvdot').style.background='var(--bad)';$('#srvtxt').textContent='Offline'}}
ping();setInterval(ping,30000);route();
</script>
