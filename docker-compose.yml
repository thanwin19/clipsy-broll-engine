# docker compose up            -> API on http://localhost:8000 (UI at /), MinIO console on :9001
# docker compose run --rm tests -> all tests (unit + integration + e2e) with mock providers, no API keys
services:
  api:
    build: .
    env_file: [.env]
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      DATABASE_URL: postgresql+psycopg://broll:broll@db:5432/broll
      PUBLIC_BASE_URL: http://localhost:8000
    ports: ["8000:8000"]
    volumes: [data:/data]
    depends_on:
      minio: {condition: service_healthy}
      db: {condition: service_healthy}

  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: broll, POSTGRES_PASSWORD: broll, POSTGRES_DB: broll}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U broll"], interval: 5s, retries: 10}
    volumes: [pg:/var/lib/postgresql/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 10}
    volumes: [minio:/data]

  tests:
    build: .
    profiles: [test]
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      ASR_PROVIDER: mock
      TTS_PROVIDER: mock
      LLM_PROVIDER: mock
      RERANK_PROVIDER: mock
      FOOTAGE_PROVIDERS: mock
      AI_IMAGE_PROVIDER: none
      MUSIC_PROVIDER: mock
    command: ["python", "-m", "pytest", "-q"]
    depends_on:
      minio: {condition: service_healthy}

volumes: {data: {}, pg: {}, minio: {}}
