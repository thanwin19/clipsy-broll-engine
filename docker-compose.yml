# docker compose up             -> API + web app on http://localhost:8000, Postgres, S3-compatible storage (SeaweedFS)
# docker compose run --rm tests -> all tests (unit + integration + e2e) with mock providers, no API keys
# Storage: SeaweedFS (Apache-2.0) speaks the S3 API. MinIO's open-source server was archived, so it is not used.
services:
  api:
    build: .
    env_file: [.env]
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: clipsy
      S3_SECRET_KEY: clipsy-dev-only-secret
      S3_BUCKET: clipsy-outputs
      S3_LINK_MODE: proxy
      DATABASE_URL: postgresql+psycopg://broll:broll@db:5432/broll
    ports: ["8000:8000"]
    volumes: [data:/data]
    depends_on:
      s3: {condition: service_healthy}
      db: {condition: service_healthy}

  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: broll, POSTGRES_PASSWORD: broll, POSTGRES_DB: broll}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U broll"], interval: 5s, retries: 10}
    volumes: [pg:/var/lib/postgresql/data]

  s3:
    image: chrislusf/seaweedfs:4.48
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - s3data:/data
      - ./deploy/s3_config.dev.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null || exit 1"], interval: 5s, retries: 20}

  tests:
    build: .
    profiles: [test]
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: clipsy
      S3_SECRET_KEY: clipsy-dev-only-secret
      S3_BUCKET: clipsy-test
      ASR_PROVIDER: mock
      TTS_PROVIDER: mock
      LLM_PROVIDER: mock
      RERANK_PROVIDER: mock
      FOOTAGE_PROVIDERS: mock
      AI_IMAGE_PROVIDER: none
      MUSIC_PROVIDER: mock
    command: ["python", "-m", "pytest", "-q"]
    depends_on:
      s3: {condition: service_healthy}

volumes: {data: {}, pg: {}, s3data: {}}
